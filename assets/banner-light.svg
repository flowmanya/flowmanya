<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#b197fc"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#000000" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="#f6f6f9"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>

  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" fill="freeze"/>
    <text x="80" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#6b6b7d">FULLSTACK DEVELOPER</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.9s" fill="freeze"/>
    <text x="78" y="188" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#111114">FlowManya</text>
  </g>

  <line x1="80" y1="216" x2="200" y2="216" stroke="#7c3aed" stroke-width="2" stroke-dasharray="120" stroke-dashoffset="120">
    <animate attributeName="stroke-dashoffset" from="120" to="0" begin="0.6s" dur="0.8s" fill="freeze"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
    <text x="80" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b4b5c">JavaScript · Python · C++ · Node.js · Git · Linux</text>
  </g>
</svg>
